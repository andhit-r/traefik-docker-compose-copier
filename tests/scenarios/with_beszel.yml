# Scenario: Authentik auth + Beszel monitoring agent enabled.
# The Beszel SSH key is shown when you click "Add system" in the Beszel hub UI.

project_name: my-traefik
network_prefix: inverseproxy
traefik_version: "v3"
traefik_domain: "traefik.example.com"
acme_email: "admin@example.com"
log_level: INFO
trusted_ips: "127.0.0.1/32,172.16.0.0/12,10.0.0.0/8"
dashboard_auth: authentik
authentik_outpost_url: "https://auth.example.com/outpost.goauthentik.io/auth/traefik"
enable_beszel_agent: true
beszel_listen_port: 45876
beszel_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIYourPublicKeyHere"
beszel_token: "your-beszel-registration-token"
beszel_hub_url: "https://beszel.example.com"
