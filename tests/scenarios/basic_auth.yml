# Scenario: HTTP Basic Auth on the dashboard, no Beszel agent.
# Generate the password hash with:
#   echo $(htpasswd -nB admin) | sed -e 's/\$/\$\$/g'

project_name: my-traefik
network_prefix: inverseproxy
traefik_version: "v3"
traefik_domain: "traefik.example.com"
acme_email: "admin@example.com"
log_level: INFO
trusted_ips: "127.0.0.1/32,172.16.0.0/12,10.0.0.0/8"
dashboard_auth: basic
basic_auth_users: "admin:$$2y$$05$$PlaceholderHashedPasswordChangeMe000000000000000"
enable_beszel_agent: false
